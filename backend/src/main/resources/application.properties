# ============================================================
# UrjaCheck backend — application.properties
# ============================================================

server.port=8080

# ---- Database (MySQL) ----
# Create the database first: CREATE DATABASE energy_assessment;



# spring.datasource.url=jdbc:mysql://localhost:3306/energy_assessment?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=${DB_PASSWORD}

# app.admin.key=${ADMIN_KEY}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/energy_assessment?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

app.admin.key=${ADMIN_KEY}

spring.datasource.hikari.max-lifetime=300000

# ---- JPA / Hibernate ----
# 'update' is convenient for development; use a migration tool (Flyway/Liquibase)
# for production instead of relying on ddl-auto.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Run data.sql AFTER Hibernate creates the schema (not before).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---- App-specific ----
# Illustrative tariff assumption in Rupees/kWh. NOT an official DISCOM tariff.
# The frontend/request may still override this per-assessment.
urjacheck.default-tariff=8.0

# ---- Swagger / OpenAPI ----
# UI available at http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
